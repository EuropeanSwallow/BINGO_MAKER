<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bingo Card Generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root {
    --bg: #0e0e0e;
    --surface: #181818;
    --surface2: #222222;
    --border: #2e2e2e;
    --border2: #3a3a3a;
    --text: #f0ede8;
    --text2: #888;
    --text3: #555;
    --accent: #c8f060;
    --accent-dim: #a8d040;
    --accent-bg: rgba(200,240,96,0.08);
    --accent-border: rgba(200,240,96,0.2);
    --red: #ff5c5c;
    --teal: #40d0a0;
    --radius: 10px;
    --radius-sm: 6px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    min-height: 100vh;
  }

  /* ── Layout ── */
  .shell { display: flex; flex-direction: column; min-height: 100vh; }

  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 28px;
    height: 56px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    position: sticky; top: 0; z-index: 100;
  }
  .logo { font-family: 'Bebas Neue', sans-serif; font-size: 26px; letter-spacing: 2px; color: var(--accent); }
  .logo span { color: var(--text2); font-size: 13px; font-family: 'DM Sans', sans-serif; letter-spacing: 0; margin-left: 10px; font-weight: 300; }

  .content { display: flex; flex: 1; }

  /* ── Sidebar ── */
  .sidebar {
    width: 320px; min-width: 320px;
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column;
    overflow-y: auto;
    background: var(--surface);
  }
  .panel { padding: 20px; border-bottom: 1px solid var(--border); }
  .panel-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 13px; letter-spacing: 1.5px;
    color: var(--text2); margin-bottom: 12px;
  }

  /* ── Tags ── */
  .tag-cloud { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 10px; max-height: 110px; overflow-y: auto; }
  .tag {
    display: inline-flex; align-items: center; gap: 4px;
    background: var(--surface2); border: 1px solid var(--border2);
    border-radius: 20px; padding: 3px 10px 3px 10px;
    font-size: 12px; color: var(--text2); cursor: default;
    transition: border-color 0.15s;
  }
  .tag:hover { border-color: var(--border2); }
  .tag .x { color: var(--text3); cursor: pointer; font-size: 14px; line-height: 1; margin-left: 2px; }
  .tag .x:hover { color: var(--red); }
  .tag.accent { background: var(--accent-bg); border-color: var(--accent-border); color: var(--accent); }

  /* ── Inputs ── */
  .add-row { display: flex; gap: 6px; }
  .add-row input, .text-input {
    flex: 1; background: var(--surface2); border: 1px solid var(--border2);
    border-radius: var(--radius-sm); padding: 7px 10px;
    color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 13px;
    outline: none; transition: border-color 0.15s;
  }
  .add-row input:focus, .text-input:focus { border-color: var(--accent); }
  .btn {
    padding: 7px 14px; border-radius: var(--radius-sm);
    border: 1px solid var(--border2); background: var(--surface2);
    color: var(--text2); font-family: 'DM Sans', sans-serif; font-size: 13px;
    cursor: pointer; transition: all 0.15s; white-space: nowrap;
  }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn-accent {
    background: var(--accent); color: #0e0e0e; border-color: var(--accent);
    font-weight: 500; padding: 10px 22px; font-size: 14px;
  }
  .btn-accent:hover { background: var(--accent-dim); border-color: var(--accent-dim); color: #0e0e0e; }
  .btn-accent:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-accent:disabled:hover { background: var(--accent); border-color: var(--accent); }

  /* ── Checkboxes ── */
  .check-row { display: flex; align-items: center; gap: 8px; color: var(--text2); cursor: pointer; font-size: 13px; margin-bottom: 8px; }
  .check-row input[type=checkbox] { accent-color: var(--accent); width: 14px; height: 14px; cursor: pointer; }

  /* ── Theme swatches ── */
  .swatches { display: flex; gap: 8px; flex-wrap: wrap; }
  .swatch {
    width: 26px; height: 26px; border-radius: 50%; cursor: pointer;
    border: 2px solid transparent; transition: transform 0.15s, border-color 0.15s;
  }
  .swatch:hover { transform: scale(1.15); }
  .swatch.active { border-color: var(--text); }

  /* ── Stats bar ── */
  .stats-bar {
    display: flex; gap: 0;
    background: var(--surface2);
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    overflow: hidden; margin-bottom: 14px;
  }
  .stat {
    flex: 1; padding: 10px 14px; text-align: center;
    border-right: 1px solid var(--border);
  }
  .stat:last-child { border-right: none; }
  .stat-n { font-family: 'Bebas Neue', sans-serif; font-size: 22px; color: var(--accent); line-height: 1; }
  .stat-l { font-size: 10px; color: var(--text3); letter-spacing: 0.5px; margin-top: 2px; text-transform: uppercase; }

  /* ── Main area ── */
  .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

  .toolbar {
    display: flex; align-items: center; gap: 10px; padding: 14px 24px;
    border-bottom: 1px solid var(--border); background: var(--surface);
    flex-wrap: wrap;
  }
  .toolbar-left { display: flex; gap: 8px; align-items: center; flex: 1; flex-wrap: wrap; }

  .pill-nav { display: flex; gap: 4px; flex-wrap: wrap; }
  .pill {
    padding: 4px 12px; border-radius: 20px; font-size: 12px; cursor: pointer;
    border: 1px solid var(--border2); background: transparent; color: var(--text2);
    font-family: 'DM Sans', sans-serif; transition: all 0.15s;
  }
  .pill:hover { border-color: var(--accent); color: var(--accent); }
  .pill.active { background: var(--accent); border-color: var(--accent); color: #0e0e0e; font-weight: 500; }

  /* ── Card grid ── */
  .card-area { flex: 1; overflow-y: auto; padding: 24px; }
  .cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 20px; }

  /* ── Bingo card ── */
  .bingo-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); overflow: hidden;
    transition: border-color 0.2s;
  }
  .bingo-card:hover { border-color: var(--border2); }

  .card-top {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 16px 10px;
    border-bottom: 1px solid var(--border);
  }
  .card-player-name {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 22px; letter-spacing: 1px;
  }
  .bingo-letters { display: flex; gap: 3px; }
  .bl {
    width: 22px; height: 22px; border-radius: 4px;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Bebas Neue', sans-serif; font-size: 13px; letter-spacing: 0.5px;
  }

  .bingo-grid-wrap { padding: 10px 12px 12px; }
  .bingo-grid {
    display: grid; grid-template-columns: repeat(5, 1fr);
    gap: 3px;
  }
  .cell {
    aspect-ratio: 1;
    display: flex; align-items: center; justify-content: center;
    text-align: center; font-size: 8px; line-height: 1.3;
    border-radius: 4px; padding: 3px;
    transition: opacity 0.2s;
    cursor: default;
  }
  .cell.free {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 14px; letter-spacing: 1px;
  }

  /* ── Warning / status ── */
  .alert {
    padding: 10px 14px; border-radius: var(--radius-sm); font-size: 13px;
    margin-bottom: 12px; border: 1px solid;
  }
  .alert.ok { background: rgba(64,208,160,0.08); border-color: rgba(64,208,160,0.25); color: var(--teal); }
  .alert.warn { background: rgba(255,92,92,0.08); border-color: rgba(255,92,92,0.25); color: var(--red); }

  /* ── Prompt manager ── */
  .prompt-list { display: flex; flex-direction: column; gap: 4px; max-height: 500px; overflow-y: auto; }
  .prompt-row {
    display: flex; align-items: center; gap: 8px;
    padding: 7px 10px; border-radius: var(--radius-sm);
    border: 1px solid var(--border); background: var(--surface2);
    font-size: 12px; color: var(--text2);
  }
  .prompt-row .del { margin-left: auto; color: var(--text3); cursor: pointer; font-size: 15px; flex-shrink: 0; }
  .prompt-row .del:hover { color: var(--red); }
  .prompt-num { font-family: 'DM Mono', monospace; font-size: 10px; color: var(--text3); min-width: 24px; }


  /* ── Tabs ── */
  .tab-bar { display: flex; border-bottom: 1px solid var(--border); background: var(--surface); }
  .tab {
    padding: 12px 20px; font-size: 13px; cursor: pointer;
    color: var(--text2); border-bottom: 2px solid transparent;
    transition: all 0.15s;
  }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }

  /* ── Empty state ── */
  .empty {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 300px; color: var(--text3); gap: 12px; text-align: center;
  }
  .empty-icon { font-family: 'Bebas Neue', sans-serif; font-size: 64px; color: var(--border2); letter-spacing: 3px; }

  /* ── Scrollbar ── */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--text3); }

  /* ── Responsive ── */
  @media (max-width: 700px) {
    .content { flex-direction: column; }
    .sidebar { width: 100%; min-width: 0; border-right: none; border-bottom: 1px solid var(--border); }
    .cards-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="shell">

  <!-- Top bar -->
  <div class="topbar">
    <div class="logo">BINGO <span>Card Generator</span></div>
    <div style="display:flex;gap:8px;align-items:center;">
      <span style="font-size:11px;color:var(--text3);margin-right:2px;">Import CSV:</span>
      <button class="btn" onclick="importCSV('prompts')">Prompts</button>
      <button class="btn" onclick="importCSV('players')">Players</button>
      <span style="width:1px;height:20px;background:var(--border);margin:0 4px;display:inline-block;"></span>
      <span style="font-size:11px;color:var(--text3);margin-right:2px;">Export CSV:</span>
      <button class="btn" onclick="exportCSV('prompts')">Prompts</button>
      <button class="btn" onclick="exportCSV('players')">Players</button>
      <span style="width:1px;height:20px;background:var(--border);margin:0 4px;display:inline-block;"></span>
      <button class="btn btn-accent" id="pdfBtn" onclick="generatePDF()">Generate PDF</button>
    </div>
  </div>

  <div class="content">

    <!-- Sidebar -->
    <div class="sidebar">

      <!-- Players -->
      <div class="panel">
        <div class="panel-title">Players</div>
        <div class="tag-cloud" id="playerTags"></div>
        <div class="add-row">
          <input type="text" id="playerInput" placeholder="Add player name…" onkeydown="if(event.key==='Enter')addPlayer()">
          <button class="btn" onclick="addPlayer()">+ Add</button>
        </div>
      </div>

      <!-- Theme -->
      <div class="panel">
        <div class="panel-title">Card Theme</div>
        <div class="swatches" id="swatches"></div>
        <p style="font-size:11px;color:var(--text3);margin-top:8px;">Last swatch = random colour per card</p>
      </div>

      <!-- Options -->
      <div class="panel">
        <div class="panel-title">Options</div>
        <label class="check-row"><input type="checkbox" id="optFree" checked> Free space in centre</label>
        <label class="check-row"><input type="checkbox" id="optExclude" checked> Exclude player's own name from card</label>
        <label class="check-row"><input type="checkbox" id="optTitle"> Show event title on cards</label>
        <div class="add-row" id="titleRow" style="display:none;margin-top:6px;">
          <input type="text" id="eventTitle" placeholder="e.g. ESL Birmingham 2026" class="text-input">
        </div>
      </div>

      <!-- Stats -->
      <div class="panel">
        <div class="panel-title">Stats</div>
        <div class="stats-bar">
          <div class="stat"><div class="stat-n" id="statPlayers">0</div><div class="stat-l">Players</div></div>
          <div class="stat"><div class="stat-n" id="statPrompts">0</div><div class="stat-l">Prompts</div></div>
          <div class="stat"><div class="stat-n" id="statPer">24</div><div class="stat-l">Per card</div></div>
        </div>
        <div id="alertBox"></div>
        <button class="btn" style="width:100%;margin-top:4px;" onclick="regenerate()">Reshuffle cards</button>
      </div>

    </div>

    <!-- Main -->
    <div class="main">
      <div class="tab-bar">
        <div class="tab active" onclick="showTab('cards',this)">Cards preview</div>
        <div class="tab" onclick="showTab('prompts',this)">Prompt manager</div>

      </div>

      <!-- Cards tab -->
      <div id="tab-cards" style="flex:1;display:flex;flex-direction:column;overflow:hidden;">
        <div class="toolbar">
          <div class="toolbar-left">
            <span style="font-size:12px;color:var(--text3);">View:</span>
            <div class="pill-nav" id="playerPills"></div>
          </div>
        </div>
        <div class="card-area">
          <div class="cards-grid" id="cardsGrid"></div>
          <div class="empty" id="emptyState">
            <div class="empty-icon">BINGO</div>
            <p>Add players and prompts to generate cards</p>
          </div>
        </div>
      </div>

      <!-- Prompts tab -->
      <div id="tab-prompts" style="display:none;flex:1;overflow:hidden;flex-direction:column;">
        <div class="toolbar">
          <div class="toolbar-left">
            <input type="text" id="promptSearch" placeholder="Search prompts…" style="background:var(--surface2);border:1px solid var(--border2);border-radius:var(--radius-sm);padding:6px 10px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:13px;outline:none;width:220px;" oninput="renderPromptList()">
          </div>
          <button class="btn" onclick="sortPrompts()">Sort A–Z</button>
        </div>
        <div style="padding:20px;overflow-y:auto;flex:1;">
          <div class="prompt-list" id="promptList"></div>
          <div style="margin-top:14px;" class="add-row">
            <input type="text" id="promptInput" placeholder="Add a new prompt…" onkeydown="if(event.key==='Enter')addPrompt()">
            <button class="btn" onclick="addPrompt()">+ Add</button>
          </div>
        </div>
      </div>



    </div>
  </div>
</div>

<script>
// ── State ──────────────────────────────────────────────
const STORAGE_KEY = 'bingo_gen_v2';

const THEMES = [
  { name:'lime',   cell:'#1a2a00', text:'#c8f060', free:'#c8f060', freeText:'#0e0e0e' },
  { name:'teal',   cell:'#002a20', text:'#40d0a0', free:'#40d0a0', freeText:'#0e0e0e' },
  { name:'purple', cell:'#1e1030', text:'#a080ff', free:'#a080ff', freeText:'#0e0e0e' },
  { name:'coral',  cell:'#2e0f08', text:'#ff7c5c', free:'#ff7c5c', freeText:'#0e0e0e' },
  { name:'blue',   cell:'#001428', text:'#60a8ff', free:'#60a8ff', freeText:'#0e0e0e' },
  { name:'pink',   cell:'#2e0818', text:'#ff70b0', free:'#ff70b0', freeText:'#0e0e0e' },
  { name:'random', cell:null, text:null, free:null, freeText:null },
];

const RANDOM_PALETTES = [
  { cell:'#1a2a00', text:'#c8f060', free:'#c8f060', freeText:'#0e0e0e' },
  { cell:'#002a20', text:'#40d0a0', free:'#40d0a0', freeText:'#0e0e0e' },
  { cell:'#1e1030', text:'#a080ff', free:'#a080ff', freeText:'#0e0e0e' },
  { cell:'#2e0f08', text:'#ff7c5c', free:'#ff7c5c', freeText:'#0e0e0e' },
  { cell:'#001428', text:'#60a8ff', free:'#60a8ff', freeText:'#0e0e0e' },
  { cell:'#2e0818', text:'#ff70b0', free:'#ff70b0', freeText:'#0e0e0e' },
  { cell:'#1a1200', text:'#f0c040', free:'#f0c040', freeText:'#0e0e0e' },
];

let state = {
  players: [],
  prompts: [],
  themeIdx: 0,
  cards: [],       // generated cards
  activePlayer: null,
};

function loadState() {
  try {
    const s = localStorage.getItem(STORAGE_KEY);
    if (s) Object.assign(state, JSON.parse(s));
  } catch(e) {}
}

function saveState() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify({ players: state.players, prompts: state.prompts, themeIdx: state.themeIdx })); } catch(e) {}
}

// ── Seed data ──────────────────────────────────────────
const DEFAULT_PROMPTS = [
  "Someone says 'Align'","Zack gets drunk and goes bed early","Chinese team top 3","SA team top 3",
  "NA team top 3","West European team top 3","East European team top 3","Smoking group forms",
  "Team wins at crib by more than 30 points","Adam breaks a toilet","Jokes that liquid didnt qualify",
  "Meet Blitz/Quinn","TeaGuv remembers us","Someone mentions ESL 2018","Someone makes a dog bark sound",
  "Rampage on mainstage","<19 min game on mainstage","Naga Carry picked on mainstage",
  "Someone shit talking Birmingham","Peaky blinders reference at ESL","Guinness runs out at the arena",
  "More than 1 rapier in a singular mainstage game","XG finish 2nd","Someone says 'Get jonned'",
  "Jon comes to ESL","Luke comes to ESL","Someone learns new, but obvious to the group dota mechanic",
  "Mcdonalds breakfast","Fraser or Adam question pro BKB purchase","Huskar 1st picked",
  "Someone says 'Polycule'","Tamatanga evening meal","Swedes ditch group for Pro friends",
  "Angus talks shit on popular opinion","Jon/Henry says 'The wife...'","Henry talks about Spa hotels",
  "Mention of Arjun's tinder account","Robbie wears black trousers, top, jacket & hat",
  "Walk past pro in city centre","Non-national in group bad mouthing England",
  "Daphne says 'Quinn is soo nice'","Angus's brain hurts and misses a game",
  "Anyone plays emulator/osrs in main arena","Someone says 'Even i could do that' when watching a game",
  "Fraser says he doesnt care about something","Someone says 'Arjun nowhere to be seen'",
  "No bad mouthing of Robbie's dota performances at any point","Gem lost within 1 minute of purchase on mainstage",
  "Someone says 'XP waste'","Zack endangers someone (e.g. pushing onto road)",
  "Fraser says 'X Nigma player goated'","Arjun wins werewolf type game",
  "Perudo; all players remaining with 1 die left","Perudo: losing/lying when calling six sixes",
  "Perudo: lost dice","Stolen aegis on mainstage","Meepo on mainstage",
  "Angus displays dislike of Jenkins","No stun pro draft","Someone says 'Win condition'",
  "Caster says 'RTZ' when someone gets cliffed or manta's","Kacper says 'Chinese Pasta'",
  "Adam/Kacper say 'Bomba'","James mentions Mable","James talks about the offlane being dead",
  "James mentions how he always buys auras and teamfight","Anyone mentions lost prophets",
  "Jon says someone should 'uninstall'","Drunk political argument","Lager vs ale debate",
  "Someone crashes out post 'discussion'","Someone gets 'svaged'","Someone says 'formerly maxed'",
  "Jolina says woke liberal nonsense","Jon/Zack mention Corpus Christi",
  "Werewolves: 'The spartacus' e.g. More than 1 seer","Jon does work instead of games in Birmingham",
  "Bad mouthing of eastern europe","Deloitte bad","Recruit extra player e.g 'Birmingham Adam'",
  "Zack pick up woman","Daphne talks about food delivery e.g VoltGate","Daphne mentions vegetarianism",
  "Anyone mentions Brexit","Zack brings capitalism into random conversation",
  "Complaints about zack or henry's snoring"
];

const DEFAULT_PLAYERS = ["Angus","Robbie","Fraser","Arjun","Henry","James","Zack","Kacper","Adam","Jolina","Daphne","Jon"];

// ── Init ──────────────────────────────────────────────
loadState();
if (!state.players.length) state.players = [...DEFAULT_PLAYERS];
if (!state.prompts.length) state.prompts = [...DEFAULT_PROMPTS];
if (state.activePlayer === null && state.players.length) state.activePlayer = state.players[0];

buildSwatches();
regenerate();
render();

// ── Core logic ────────────────────────────────────────
function mentionsName(prompt, name) {
  const escaped = name.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  return new RegExp(`\\b${escaped}(?:'s?|)\\b`, 'i').test(prompt);
}

function getThemeForPlayer(idx) {
  const t = THEMES[state.themeIdx];
  if (t.name !== 'random') return t;
  return RANDOM_PALETTES[idx % RANDOM_PALETTES.length];
}

function regenerate() {
  const freeSpace = document.getElementById('optFree') ? document.getElementById('optFree').checked : true;
  const excludeName = document.getElementById('optExclude') ? document.getElementById('optExclude').checked : true;
  const needed = 25 - (freeSpace ? 1 : 0);
  const n = state.players.length;

  // Mixing rule 1: no prompt appears on more than 75% of cards
  const maxAppearances = Math.max(1, Math.ceil(n * 0.75));
  // Mixing rule 2: total unique prompts used must cover at least 50% of players * needed slots
  // (enforced naturally by rule 1 when prompt pool is large enough)
  const minUniquePrompts = Math.ceil(n * 0.5);

  const usageCount = {};
  state.prompts.forEach(p => { usageCount[p] = 0; });

  state.cards = [];

  for (let i = 0; i < n; i++) {
    const name = state.players[i];

    const baseValid = excludeName
      ? state.prompts.filter(p => !mentionsName(p, name))
      : state.prompts.slice();

    if (baseValid.length < needed) {
      state.cards.push({ name, error: 'Only ' + baseValid.length + ' valid prompts (need ' + needed + ')', cells: [] });
      continue;
    }

    // Prefer prompts that haven't hit the appearance cap yet
    const underUsed = baseValid.filter(p => (usageCount[p] || 0) < maxAppearances);
    const overUsed  = baseValid.filter(p => (usageCount[p] || 0) >= maxAppearances);

    let pool;
    if (underUsed.length >= needed) {
      pool = shuffle(underUsed.slice()).slice(0, needed);
    } else if (underUsed.length + overUsed.length >= needed) {
      pool = shuffle(underUsed.slice()).concat(shuffle(overUsed.slice())).slice(0, needed);
    } else {
      state.cards.push({ name, error: 'Only ' + baseValid.length + ' valid prompts (need ' + needed + ')', cells: [] });
      continue;
    }

    pool.forEach(p => { usageCount[p] = (usageCount[p] || 0) + 1; });

    const shuffled = shuffle(pool.slice());
    const cells = [];
    let idx = 0;
    for (let r = 0; r < 5; r++) {
      for (let c = 0; c < 5; c++) {
        if (freeSpace && r === 2 && c === 2) cells.push({ text: 'FREE', free: true });
        else cells.push({ text: shuffled[idx++], free: false });
      }
    }
    state.cards.push({ name, cells, theme: getThemeForPlayer(i) });
  }

  // Compute mixing health for stats display
  const counts = Object.values(usageCount);
  const usedPrompts = counts.filter(c => c > 0).length;
  const maxUsage = counts.length ? Math.max.apply(null, counts) : 0;
  state.mixingStats = { usedPrompts, maxUsage, maxAppearances, minUniquePrompts, n };

  renderCards();
  updateStats();
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

// ── Render ────────────────────────────────────────────
function render() {
  renderPlayerTags();
  renderPlayerPills();
  renderPromptList();
  renderCards();
  updateStats();
}

function renderPlayerTags() {
  const el = document.getElementById('playerTags');
  el.innerHTML = state.players.map((p,i) =>
    `<span class="tag accent">${p}<span class="x" onclick="removePlayer(${i})">×</span></span>`
  ).join('');
}

function renderPlayerPills() {
  const el = document.getElementById('playerPills');
  const allActive = state.activePlayer === null;
  el.innerHTML = `<button class="pill ${allActive?'active':''}" onclick="setActivePlayer(null)">All</button>` +
    state.players.map(p =>
      `<button class="pill ${state.activePlayer===p?'active':''}" onclick="setActivePlayer('${p.replace(/'/g,"\\'")}')">
        ${p}</button>`
    ).join('');
}

function setActivePlayer(name) {
  state.activePlayer = name;
  renderPlayerPills();
  renderCards();
}

function renderCards() {
  const grid = document.getElementById('cardsGrid');
  const empty = document.getElementById('emptyState');
  const filtered = state.activePlayer
    ? state.cards.filter(c => c.name === state.activePlayer)
    : state.cards;

  if (!filtered.length) {
    grid.innerHTML = '';
    empty.style.display = 'flex';
    return;
  }
  empty.style.display = 'none';

  grid.innerHTML = filtered.map((card, ci) => {
    if (card.error) return `<div class="bingo-card" style="padding:20px;">
      <div style="color:var(--red);font-weight:500;">${card.name}</div>
      <div style="color:var(--text3);font-size:12px;margin-top:6px;">${card.error}</div>
    </div>`;

    const t = card.theme || getThemeForPlayer(ci);
    const letters = ['B','I','N','G','O'];
    const blHeaders = letters.map((l,li) => {
      const bg = li === 3 ? t.free : t.cell;
      const col = li === 3 ? t.freeText : t.text;
      return `<div class="bl" style="background:${bg};color:${col};">${l}</div>`;
    }).join('');

    const cells = card.cells.map(cell => {
      if (cell.free) return `<div class="cell free" style="background:${t.free};color:${t.freeText};">FREE</div>`;
      return `<div class="cell" style="background:${t.cell};color:${t.text};">${escHtml(cell.text)}</div>`;
    }).join('');

    const title = document.getElementById('optTitle')?.checked
      ? `<span style="font-size:10px;color:var(--text3);">${escHtml(document.getElementById('eventTitle')?.value||'')}</span>` : '';

    return `<div class="bingo-card">
      <div class="card-top">
        <div>
          <div class="card-player-name" style="color:${t.text};">${escHtml(card.name)}</div>
          ${title}
        </div>
        <div class="bingo-letters">${blHeaders}</div>
      </div>
      <div class="bingo-grid-wrap">
        <div class="bingo-grid">${cells}</div>
      </div>
    </div>`;
  }).join('');
}

function renderPromptList() {
  const el = document.getElementById('promptList');
  const q = (document.getElementById('promptSearch')?.value || '').toLowerCase();
  const filtered = state.prompts
    .map((p,i) => ({p,i}))
    .filter(({p}) => !q || p.toLowerCase().includes(q));

  el.innerHTML = filtered.map(({p,i}) =>
    `<div class="prompt-row">
      <span class="prompt-num">${i+1}</span>
      <span style="flex:1;">${escHtml(p)}</span>
      <span class="del" onclick="removePrompt(${i})">×</span>
    </div>`
  ).join('') || `<div style="color:var(--text3);font-size:13px;padding:10px;">No prompts match.</div>`;
}

function updateStats() {
  document.getElementById('statPlayers').textContent = state.players.length;
  document.getElementById('statPrompts').textContent = state.prompts.length;

  const freeSpace = document.getElementById('optFree') ? document.getElementById('optFree').checked : true;
  const needed = 25 - (freeSpace ? 1 : 0);
  document.getElementById('statPer').textContent = needed;

  const alertBox = document.getElementById('alertBox');
  const hasErrors = state.cards.some(c => c.error);
  const n = state.players.length;

  if (n === 0) {
    alertBox.innerHTML = '<div class="alert warn">Add at least one player.</div>';
  } else if (state.prompts.length < needed) {
    alertBox.innerHTML = '<div class="alert warn">Need at least ' + needed + ' prompts (have ' + state.prompts.length + ').</div>';
  } else if (hasErrors) {
    alertBox.innerHTML = '<div class="alert warn">Some players don\'t have enough valid prompts after name filtering.</div>';
  } else if (state.mixingStats && n > 1) {
    const { usedPrompts, maxUsage, maxAppearances, minUniquePrompts } = state.mixingStats;
    const mixingOk = usedPrompts >= minUniquePrompts && maxUsage <= maxAppearances;
    const capLabel = maxAppearances + '/' + n + ' cards';
    if (mixingOk) {
      alertBox.innerHTML = '<div class="alert ok">'
        + 'All ' + n + ' cards generated. '
        + usedPrompts + ' unique prompts used &mdash; '
        + 'max any prompt appears: ' + maxUsage + ' (' + capLabel + ' cap).'
        + '</div>';
    } else {
      alertBox.innerHTML = '<div class="alert warn">'
        + 'Mixing targets not fully met. ' + usedPrompts + ' unique prompts used. '
        + 'Add more prompts to improve card variety.'
        + '</div>';
    }
  } else {
    alertBox.innerHTML = '<div class="alert ok">All ' + n + ' cards generated.</div>';
  }

  document.getElementById('pdfBtn').disabled = state.cards.length === 0 || hasErrors;
}

// ── Players ───────────────────────────────────────────
function addPlayer() {
  const input = document.getElementById('playerInput');
  const name = input.value.trim();
  if (!name || state.players.includes(name)) { input.value = ''; return; }
  state.players.push(name);
  input.value = '';
  if (!state.activePlayer) state.activePlayer = name;
  saveState();
  regenerate();
  render();
}

function removePlayer(i) {
  const removed = state.players[i];
  state.players.splice(i, 1);
  if (state.activePlayer === removed) state.activePlayer = state.players[0] || null;
  saveState();
  regenerate();
  render();
}

// ── Prompts ───────────────────────────────────────────
function addPrompt() {
  const input = document.getElementById('promptInput');
  const val = input.value.trim();
  if (!val || state.prompts.includes(val)) { input.value = ''; return; }
  state.prompts.push(val);
  input.value = '';
  saveState();
  regenerate();
  renderPromptList();
  updateStats();
}

function removePrompt(i) {
  state.prompts.splice(i, 1);
  saveState();
  regenerate();
  renderPromptList();
  updateStats();
}

function sortPrompts() {
  state.prompts.sort((a,b) => a.localeCompare(b));
  saveState();
  renderPromptList();
}


// ── Theme ─────────────────────────────────────────────
function buildSwatches() {
  const colors = ['#c8f060','#40d0a0','#a080ff','#ff7c5c','#60a8ff','#ff70b0','conic-gradient(#c8f060,#a080ff,#ff7c5c,#40d0a0)'];
  const wrap = document.getElementById('swatches');
  wrap.innerHTML = colors.map((c,i) =>
    `<div class="swatch ${i===state.themeIdx?'active':''}" style="background:${c};" onclick="setTheme(${i})"></div>`
  ).join('');
}

function setTheme(i) {
  state.themeIdx = i;
  saveState();
  buildSwatches();
  regenerate();
}

// ── Tabs ──────────────────────────────────────────────
function showTab(name, el) {
  ['cards','prompts'].forEach(t => {
    document.getElementById(`tab-${t}`).style.display = t === name ? 'flex' : 'none';
  });
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  if (name === 'prompts') renderPromptList();
}

// ── Option toggles ────────────────────────────────────
document.getElementById('optFree').addEventListener('change', () => { regenerate(); updateStats(); });
document.getElementById('optExclude').addEventListener('change', () => { regenerate(); updateStats(); });
document.getElementById('optTitle').addEventListener('change', function() {
  document.getElementById('titleRow').style.display = this.checked ? 'flex' : 'none';
  renderCards();
});
document.getElementById('eventTitle').addEventListener('input', renderCards);

// ── PDF Export ────────────────────────────────────────
function generatePDF() {
  const { jsPDF } = window.jspdf;
  if (!jsPDF) { alert('PDF library not loaded. Check your internet connection.'); return; }

  const doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
  const W = 210, H = 297;
  const margin = 15;
  const freeSpace = document.getElementById('optFree').checked;
  const showTitle = document.getElementById('optTitle').checked;
  const eventTitle = document.getElementById('eventTitle').value || '';

  const cards = state.cards.filter(c => !c.error);

  cards.forEach((card, ci) => {
    if (ci > 0) doc.addPage();

    const t = card.theme || getThemeForPlayer(ci);
    const [cr, cg, cb] = hexToRgb(t.cell);
    const [tr, tg, tb] = hexToRgb(t.text);
    const [fr, fg, fb] = hexToRgb(t.free);
    const [ftr, ftg, ftb] = hexToRgb(t.freeText);

    // Background
    doc.setFillColor(14, 14, 14);
    doc.rect(0, 0, W, H, 'F');

    // Player name
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(32);
    doc.setTextColor(tr, tg, tb);
    doc.text(card.name.toUpperCase(), margin, margin + 14);

    // Event subtitle
    if (showTitle && eventTitle) {
      doc.setFont('helvetica', 'normal');
      doc.setFontSize(10);
      doc.setTextColor(100, 100, 100);
      doc.text(eventTitle, margin, margin + 21);
    }

    // BINGO header row
    const letters = ['B','I','N','G','O'];
    const gridLeft = margin;
    const gridTop = margin + 28;
    const cellSize = (W - margin * 2) / 5;
    const headerH = 10;

    letters.forEach((l, li) => {
      const x = gridLeft + li * cellSize;
      if (li === 3) {
        doc.setFillColor(fr, fg, fb);
        doc.setTextColor(ftr, ftg, ftb);
      } else {
        doc.setFillColor(tr, tg, tb);
        doc.setTextColor(14, 14, 14);
      }
      doc.roundedRect(x, gridTop, cellSize - 1, headerH, 2, 2, 'F');
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(12);
      doc.text(l, x + cellSize / 2 - 0.5, gridTop + 7, { align: 'center' });
    });

    // Grid cells
    const gridBodyTop = gridTop + headerH + 2;
    const bodyH = H - gridBodyTop - margin;
    const rowH = bodyH / 5;

    card.cells.forEach((cell, idx) => {
      const row = Math.floor(idx / 5);
      const col = idx % 5;
      const x = gridLeft + col * cellSize;
      const y = gridBodyTop + row * rowH;

      if (cell.free) {
        doc.setFillColor(fr, fg, fb);
        doc.roundedRect(x, y, cellSize - 1, rowH - 1, 2, 2, 'F');
        doc.setFont('helvetica', 'bold');
        doc.setFontSize(16);
        doc.setTextColor(ftr, ftg, ftb);
        doc.text('FREE', x + (cellSize - 1) / 2, y + rowH / 2 + 2, { align: 'center' });
      } else {
        doc.setFillColor(cr, cg, cb);
        doc.roundedRect(x, y, cellSize - 1, rowH - 1, 2, 2, 'F');

        // Wrap text
        doc.setFont('helvetica', 'normal');
        doc.setTextColor(tr, tg, tb);
        const maxW = cellSize - 6;
        const txt = cell.text;
        let fontSize = 9;
        if (txt.length > 60) fontSize = 7;
        else if (txt.length > 40) fontSize = 8;
        doc.setFontSize(fontSize);
        const lines = doc.splitTextToSize(txt, maxW);
        const lineH = fontSize * 0.45;
        const totalH = lines.length * lineH;
        const startY = y + rowH / 2 - totalH / 2 + lineH;
        lines.forEach((line, li) => {
          doc.text(line, x + (cellSize - 1) / 2, startY + li * lineH, { align: 'center' });
        });
      }
    });

    // Card border accent line
    doc.setDrawColor(tr, tg, tb);
    doc.setLineWidth(0.5);
    doc.line(margin, margin + 24, W - margin, margin + 24);
  });

  doc.save('bingo_cards.pdf');
}

function hexToRgb(hex) {
  const r = parseInt(hex.slice(1,3), 16);
  const g = parseInt(hex.slice(3,5), 16);
  const b = parseInt(hex.slice(5,7), 16);
  return [r, g, b];
}

// ── Import / Export CSV ──────────────────────────────
// CSV format: one entry per line, no header needed.
// Prompts can contain commas freely — each line is one prompt.
// Players: one name per line.

function exportCSV(type) {
  const items = type === 'prompts' ? state.prompts : state.players;
  const filename = type === 'prompts' ? 'bingo_prompts.csv' : 'bingo_players.csv';
  // One item per line. If an item contains a quote, escape it.
  const csv = items.map(item => {
    const s = String(item);
    // Wrap in quotes if contains comma, newline, or quote
    if (s.includes(',') || s.includes('"') || s.includes('\n')) {
      return '"' + s.replace(/"/g, '""') + '"';
    }
    return s;
  }).join('\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = filename; a.click();
  URL.revokeObjectURL(url);
}

function importCSV(type) {
  const input = document.createElement('input');
  input.type = 'file'; input.accept = '.csv,.txt';
  input.onchange = e => {
    const file = e.target.files[0];
    const reader = new FileReader();
    reader.onload = ev => {
      const lines = parseCSVLines(ev.target.result);
      let added = 0;
      if (type === 'prompts') {
        lines.forEach(l => { if (l && !state.prompts.includes(l)) { state.prompts.push(l); added++; } });
      } else {
        lines.forEach(l => { if (l && !state.players.includes(l)) { state.players.push(l); added++; } });
        if (state.players.length && !state.activePlayer) state.activePlayer = state.players[0];
      }
      saveState(); regenerate(); render();
      alert(`Imported ${added} ${type} (${lines.length - added} duplicates skipped).`);
    };
    reader.readAsText(file);
  };
  input.click();
}

function parseCSVLines(text) {
  // Handles quoted fields (RFC 4180). Each line = one entry.
  const results = [];
  const lines = text.split(/\r?\n/);
  for (let line of lines) {
    line = line.trim();
    if (!line) continue;
    // Strip surrounding quotes and unescape doubled quotes
    if (line.startsWith('"') && line.endsWith('"')) {
      line = line.slice(1, -1).replace(/""/g, '"');
    }
    results.push(line);
  }
  return results;
}

// ── Helpers ───────────────────────────────────────────
function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function tab_display(id, val) {
  const el = document.getElementById(id);
  if (el) el.style.display = val;
}
